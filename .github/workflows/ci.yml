name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
      - name: "Smoke: init → wallet → verify"
        env:
          KLEX_WALLET_PASS: ci-smoke-pass
        shell: bash
        run: |
          klex --datadir "$HOME/.klex-ci" init
          klex --datadir "$HOME/.klex-ci" wallet new
          klex --datadir "$HOME/.klex-ci" wallet show
          klex --datadir "$HOME/.klex-ci" verify
          klex --datadir "$HOME/.klex-ci" info

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t klex-coin:ci .
      - name: Init node inside container
        run: docker run --rm klex-coin:ci python -m klex info